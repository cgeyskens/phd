name: spatial-transcriptomics
channels:
  - conda-forge
  - defaults
dependencies:
  # Core dependencies
  - python=3.11
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - seaborn
  - matplotlib
  - numba

  # Image processing & visualization
  - scikit-image
  - opencv
  - pillow
  - imageio
  - tifffile

  # Miscellaneous utilities
  - pip
  - tqdm

  # Pip-based dependencies
  - pip:
      - anndata
      - fastdist
      - h5py
      - natsort
      - pynndescent
      - scanpy
      - stdlib-list
      - umap-learn
      - alphashape
      - geopandas
      - spatialdata
      - anndata
      - xarray
      - spatialdata_plot
