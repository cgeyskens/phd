name: spatial-transcriptomics
channels:
  - conda-forge
  - defaults
dependencies:
  # Core dependencies
  - python=3.9
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - seaborn
  - matplotlib
  - numba
  - statsmodels

  # Graph & clustering tools
  - igraph
  - leidenalg
  - metis
  - networkx

  # Image processing & visualization
  - scikit-image
  - opencv
  - pillow
  - imageio
  - tifffile
  - pywavelets

  # I/O and performance optimizations
  - hdf5
  - pytables
  - joblib
  - lz4-c
  - blosc

  # Miscellaneous utilities
  - pip
  - tqdm
  - patsy
  - sinfo
  - xlrd
  - threadpoolctl

  # Pip-based dependencies
  - pip:
      - anndata
      - fastdist
      - h5py
      - natsort
      - pynndescent
      - scanpy
      - stdlib-list
      - umap-learn
